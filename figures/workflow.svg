   </g>
   <g id="text_8">
    <text style="font-size: 8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #0b2545" transform="translate(160.635 178.026406)">Local SHAP</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #0b2545" transform="translate(149.7575 187.288594)">(waterfall, force)</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #ffffff" transform="translate(270.705 178.026406)">Spatial SHAP</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #ffffff" transform="translate(251.529375 187.288594)">per-cell contributions</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #0b2545" transform="translate(382.82625 178.026406)">Maps &amp; GeoTIFFs</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #0b2545" transform="translate(370.473125 187.288594)">prediction · uncertainty</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #0b2545" transform="translate(504.6225 178.026406)">Export &amp; HTML</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #0b2545" transform="translate(522.295 187.288594)">report</text>
   </g>
   <g id="text_12">
    <text style="font-style: italic; font-size: 7.5px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: middle; fill: #5c6b7a" x="300.15" y="128.0592" transform="rotate(-0 300.15 128.0592)">final model used for explanation</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #0b2545" transform="translate(15.57 230.753816)">Key idea: SHAP values are computed for every observation or grid cell and written back to the same</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #0b2545" transform="translate(15.57 240.048)">location, so the explanation itself becomes a map.</text>
   </g>
   <g id="text_14">
    <text style="font-style: italic; font-size: 8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start; fill: #5c6b7a" x="15.57" y="261.1152" transform="rotate(-0 15.57 261.1152)">SHAP describes model behaviour (association), not causal effects.</text>
   </g>
  </g>
