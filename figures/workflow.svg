   </g>
   <g id="text_2">
    <text style="font-size: 8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #0b2545" transform="translate(50.12625 81.006406)">Dataset</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #0b2545" transform="translate(32.556875 90.268594)">(points / rasters)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #0b2545" transform="translate(162.459375 81.006406)">Validate &amp;</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #0b2545" transform="translate(161.045625 90.268594)">preprocess</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #0b2545" transform="translate(291.280625 80.873281)">Split</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #0b2545" transform="translate(267.43 90.179219)">random | spatial</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #ffffff" transform="translate(391.924375 76.375312)">Train models</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #ffffff" transform="translate(368.214375 85.6375)">RF · XGBoost · LightGBM</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #ffffff" transform="translate(390.67875 94.899687)">MLP · LogReg</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #0b2545" transform="translate(517.036875 81.006406)">Evaluate</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #0b2545" transform="translate(495.605625 90.268594)">+ spatial validation</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #0b2545" transform="translate(41.063125 178.026406)">Global SHAP</text>
