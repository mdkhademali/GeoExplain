[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoxplain"
dynamic = ["version"]
description = "Explainable machine learning for geospatial prediction: SHAP, spatial SHAP maps and spatial validation."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Md Khadem Ali" }]
keywords = ["GeoAI", "explainable AI", "SHAP", "GIS", "remote sensing", "spatial validation", "machine learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "shap>=0.44",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "rasterio>=1.3",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.5",
    "joblib>=1.3",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "build>=1.0", "twine>=5.0", "pyyaml>=6.0"]
notebooks = ["jupyter", "nbclient", "ipykernel"]

[project.urls]
Homepage = "https://github.com/mdkhademali/GeoExplain"
Documentation = "https://github.com/mdkhademali/GeoExplain/tree/main/docs"
Issues = "https://github.com/mdkhademali/GeoExplain/issues"
Changelog = "https://github.com/mdkhademali/GeoExplain/blob/main/CHANGELOG.md"

[project.scripts]
geoxplain = "geoxplain.cli:main"

[tool.setuptools.dynamic]
version = { attr = "geoxplain._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905", "B008", "UP007", "UP037", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"qgis/**" = ["E402"]
