name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-paths: pyproject.toml
           - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Show SHAP and XGBoost versions
        run: |
          python -c "import shap, xgboost; print('SHAP:', shap.__version__); print('XGBoost:', xgboost.__version__)"

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: pytest --cov=geoxplain --cov-report=term-missing

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
